name: Standalone binaries (experiment)

# Exploratory work for #2055 and #1989: build OpenSpec as a standalone
# executable with bun, deno and a Node single executable application (SEA) on
# each OS, smoke-test it against the Node build, and measure its size, startup
# time and signature state. Publishes nothing. Scripts: scripts/standalone/.

on:
  workflow_dispatch:
  push:
    branches: ['exp/**']

permissions:
  contents: read

concurrency:
  group: standalone-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSPEC_TELEMETRY: '0'
  OPENSPEC_NO_UPDATE_CHECK: '1'
  # One Node for everything: pnpm, the `node bin/openspec.js` baseline and the
  # SEA, whose `node --build-sea` needs Node >= 25.5.
  NODE_VERSION: '26.12.0'
  BUN_VERSION: '1.4.3'
  DENO_VERSION: '2.9.7'

jobs:
  cell:
    name: ${{ matrix.tool }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tool: [bun, deno, node-sea]
    defaults:
      run:
        # Git Bash on Windows, which also puts `diff` on PATH for the smoke test.
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Bun compiles the bun binary and bundles the SEA's single script.
      - name: Setup Bun
        if: matrix.tool == 'bun' || matrix.tool == 'node-sea'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Deno
        if: matrix.tool == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Print tool versions
        run: |
          node --version
          pnpm --version
          if command -v bun >/dev/null; then bun --version; fi
          if command -v deno >/dev/null; then deno --version; fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      # deno compile embeds node_modules as it is, dev dependencies included.
      # A fresh production-only install matches what `npm install` of the
      # package brings, so the binary size reflects the CLI.
      - name: Reinstall production dependencies only (deno)
        if: matrix.tool == 'deno'
        run: |
          node -e "require('fs').rmSync('node_modules', { recursive: true, force: true })"
          pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Build standalone binary
        continue-on-error: true
        run: node scripts/standalone/build.mjs ${{ matrix.tool }}

      - name: Smoke test
        continue-on-error: true
        run: node scripts/standalone/smoke.mjs --tool ${{ matrix.tool }}

      # Same binary, built-in schemas copied to a cache directory first, as the
      # SEA does, instead of read from Bun's virtual file system.
      - name: Smoke test (bun, schemas extracted to disk)
        if: matrix.tool == 'bun'
        continue-on-error: true
        run: node scripts/standalone/smoke.mjs --tool bun --label bun+extract --env OPENSPEC_STANDALONE_SCHEMAS=extract

      - name: Measure size, startup and signature
        continue-on-error: true
        run: node scripts/standalone/measure.mjs --tool ${{ matrix.tool }} --runs 20 --warmup 3

      - name: Write summary
        if: always()
        run: node scripts/standalone/report.mjs cell --tool ${{ matrix.tool }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-results-${{ matrix.tool }}-${{ matrix.os }}
          path: dist-standalone/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if this cell failed
        run: node scripts/standalone/report.mjs verdict --tool ${{ matrix.tool }}

  aggregate:
    name: Aggregate results
    needs: cell
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: standalone-results-*
          path: results

      - name: Merge results into one table
        run: node scripts/standalone/report.mjs aggregate results

      - name: Upload merged results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-summary
          path: |
            results/summary.md
            results/summary.json
          retention-days: 14
